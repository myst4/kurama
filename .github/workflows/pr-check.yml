name: PR Validation

on:
  pull_request:
    types: [opened, edited, labeled, unlabeled, synchronize]

jobs:
  check-issue-reference:
    name: Check Issue Reference
    runs-on: ubuntu-latest
    steps:
      - name: Verify PR links an issue
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            const issuePattern = /(?:closes|fixes|resolves)\s+#(\d+)/gi;
            const matches = [...body.matchAll(issuePattern)];

            if (matches.length === 0) {
              core.setFailed(
                '❌ PR must reference an approved issue.\n' +
                'Add "Closes #N", "Fixes #N", or "Resolves #N" to the PR body.\n' +
                'See CONTRIBUTING.md for the full contribution workflow.'
              );
            } else {
              const issueNumbers = matches.map(m => m[1]).join(', ');
              core.info(`✅ Found issue reference(s): #${issueNumbers}`);
            }

  check-issue-approved:
    name: Check Issue Has status:approved
    runs-on: ubuntu-latest
    needs: check-issue-reference
    steps:
      - name: Verify linked issue is approved
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const body = context.payload.pull_request.body || '';
            const issuePattern = /(?:closes|fixes|resolves)\s+#(\d+)/gi;
            const matches = [...body.matchAll(issuePattern)];

            if (matches.length === 0) {
              core.setFailed('❌ No issue reference found in PR body.');
              return;
            }

            const failures = [];

            for (const match of matches) {
              const issueNumber = parseInt(match[1], 10);
              core.info(`Checking issue #${issueNumber} for status:approved label...`);

              let issue;
              try {
                const response = await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                });
                issue = response.data;
              } catch (err) {
                failures.push(`Issue #${issueNumber}: could not be fetched (${err.message})`);
                continue;
              }

              const labels = issue.labels.map(l => l.name);
              core.info(`Issue #${issueNumber} labels: ${labels.join(', ') || '(none)'}`);

              if (!labels.includes('status:approved')) {
                failures.push(
                  `Issue #${issueNumber} ("${issue.title}") does not have the \`status:approved\` label. ` +
                  `A maintainer must approve the issue before a PR can be merged.`
                );
              } else {
                core.info(`✅ Issue #${issueNumber} has status:approved`);
              }
            }

            if (failures.length > 0) {
              core.setFailed('❌ Linked issue(s) not approved:\n' + failures.join('\n'));
            }

  check-type-label:
    name: Check PR Has type:* Label
    runs-on: ubuntu-latest
    steps:
      - name: Verify PR has a type label
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = context.payload.pull_request.number;

            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            const labels = pullRequest.labels.map(l => l.name);
            core.info(`PR #${prNumber} labels: ${labels.join(', ') || '(none)'}`);

            const typeLabels = labels.filter(l => l.startsWith('type:'));

            if (typeLabels.length === 0) {
              core.setFailed(
                '❌ PR must have exactly one type:* label.\n' +
                'Valid types: type:bug, type:feature, type:docs, type:refactor, type:chore, type:breaking-change\n' +
                'Add the label to the PR after opening it.'
              );
            } else if (typeLabels.length > 1) {
              core.setFailed(
                `❌ PR has multiple type:* labels: ${typeLabels.join(', ')}.\n` +
                'Please keep exactly one type label.'
              );
            } else {
              core.info(`✅ PR has type label: ${typeLabels[0]}`);
            }

  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        run: |
          # Every *.sh in the repo, not just scripts/*.sh. The two PreToolUse
          # hooks under examples/claude-code/hooks/ run on the user's machine on
          # every Task/Skill call and block with exit 2 — they shipped with zero
          # lint coverage. NUL-delimited so a path with spaces stays one argument.
          echo "Files under shellcheck:"
          find . -path ./.git -prune -o -name '*.sh' -type f -print | sort | awk '{ print "  " $0 }'
          find . -path ./.git -prune -o -name '*.sh' -type f -print0 \
            | xargs -0 -r shellcheck

  install-test:
    name: Install tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Run install/setup test suite
        run: bash scripts/install_test.sh

  validate-skills:
    name: Validate skills (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install PyYAML (enables the YAML block check)
        run: python -m pip install --upgrade pyyaml
      - name: Run skills structural linter
        run: bash scripts/validate_skills.sh

  examples-drift:
    name: Generated examples are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Read-only, so it runs before anything mutates the tree. Both generators
      # exit 3 when a committed artifact no longer matches its source (the fox
      # grid, the banner wordmark); nothing used to call either, so fox.txt and
      # both kurama-logo artifacts could drift unguarded. Node ships on the
      # GitHub-hosted runners; the generators use node builtins only.
      - name: Generated banner artifacts are up to date
        run: |
          node scripts/gen-braille.mjs --check
          node scripts/gen-logo-plugin.mjs --check
      - name: Rebuild orchestrator examples from templates
        run: bash scripts/build-examples.sh
      - name: Fail if examples/ drifted from examples/_templates/
        run: |
          # `git diff` only reports TRACKED files, so generated output that was
          # never committed used to sail through this gate. Staging first puts
          # untracked files in the index, and `git diff --cached` then sees new
          # files and modifications alike.
          git add -A -- examples/
          if ! git diff --cached --quiet -- examples/; then
            echo "::error::Generated examples are out of date. Edit examples/_templates/, run scripts/build-examples.sh, and commit the result."
            git --no-pager diff --cached --stat -- examples/
            git --no-pager diff --cached -- examples/
            exit 1
          fi
          echo "Generated examples match examples/_templates/."

  forbidden-claims:
    name: Deliberate removals stay removed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docs must not advertise a removed component
        run: |
          # ── Deliberate-removals docs gate ────────────────────────────────
          # Kurama removes components on purpose (a plugin that hung the TUI, a
          # flag that never existed). The docs then keep advertising them: the
          # background-agents.ts claims outlived the plugin across three
          # releases because no job ever read the docs. This step is that job.
          #
          # To register a newly removed component, add ONE line to FORBIDDEN:
          #     <awk ERE pattern> <exact paths exempted wholesale, space separated>
          #
          # Scope: tracked files under docs/, examples/ and README.md. scripts/
          # is deliberately out — the installers must name removed components in
          # order to delete them.
          #
          # A match is ALLOWED when the paragraph around it (blank-line
          # delimited, so a wrapped sentence counts as one unit) also carries a
          # removal marker. That is what lets "Kurama no longer ships the
          # background-agents.ts plugin" pass while a fresh install or usage
          # instruction fails. A file whose PATH names the component always
          # fails, however innocent its contents.
          MARKERS='no longer|removed|dropped|deliberately not|do not install|never install|legacy'

          FORBIDDEN='
          background-agents docs/changelog.md docs/migration.md
          '

          fail=0
          while read -r pattern exempt; do
            [ -n "$pattern" ] || continue
            case "$pattern" in \#*) continue ;; esac
            while IFS= read -r -d '' file; do
              skip=0
              for allowed in $exempt; do
                [ "$file" = "$allowed" ] && skip=1
              done
              [ "$skip" -eq 1 ] && continue
              if printf '%s' "$file" | grep -Eq "$pattern"; then
                printf '%s: path names a deliberately removed component\n' "$file"
                fail=1
              fi
              awk -v pat="$pattern" -v markers="$MARKERS" -v file="$file" '
                function flush(   i, hit, marked) {
                  hit = 0; marked = 0
                  for (i = 1; i <= n; i++) {
                    if (buf[i] ~ pat)              hit = 1
                    if (tolower(buf[i]) ~ markers) marked = 1
                  }
                  if (hit && !marked) {
                    for (i = 1; i <= n; i++)
                      if (buf[i] ~ pat) printf "%s:%d: %s\n", file, ln[i], buf[i]
                    bad = 1
                  }
                  n = 0
                }
                /^[[:space:]]*$/ { flush(); next }
                { buf[++n] = $0; ln[n] = FNR }
                END { flush(); exit (bad ? 1 : 0) }
              ' "$file" || fail=1
            done < <(git ls-files -z -- docs README.md examples)
          done <<EOF
          $FORBIDDEN
          EOF

          if [ "$fail" -ne 0 ]; then
            echo "::error::Documentation advertises a deliberately removed component. Drop the claim, or phrase it as a removal note (see the FORBIDDEN comment in this workflow)."
            exit 1
          fi
          echo "No forbidden claims in docs/, README.md or examples/."
